services:
  mysql:
    image: mysql:8.4
    container_name: inventory-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "SHeshan@1234"
      MYSQL_DATABASE: inventory_db

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pSHeshan@1234"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: inventory-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: "docker"

      DB_URL: "jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo"
      DB_USERNAME: "root"
      DB_PASSWORD: "SHeshan@1234"

      SPRING_FLYWAY_ENABLED: "true"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: inventory-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mysql-data: