<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded blue box background -->
  <rect width="32" height="32" rx="9" fill="url(#brandGrad)" />
  <!-- Inner 2x2 grid logo matching our application's style -->
  <rect x="6" y="6" width="8" height="8" rx="2" fill="none" stroke="white" stroke-width="2.5" />
  <rect x="18" y="6" width="8" height="8" rx="2" fill="none" stroke="white" stroke-width="2.5" />
  <rect x="6" y="18" width="8" height="8" rx="2" fill="none" stroke="white" stroke-width="2.5" />
  <rect x="18" y="18" width="8" height="8" rx="2" fill="none" stroke="white" stroke-width="2.5" />
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
</svg>